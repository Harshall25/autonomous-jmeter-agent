spring:
  application:
    name: autonomous-jmeter-agent
  main:
    banner-mode: off
    # A CLI by default: a run started from a pipeline has no business opening a port.
    # Start with --spring.main.web-application-type=servlet to serve the control plane
    # instead — the run ledger at /api/runs and the heal-diff UI at /.
    web-application-type: none
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:PLACEHOLDER_KEY}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-3-5-sonnet-20240620}
          # Plans run to thousands of lines of XML, and a truncated plan is an unusable one.
          max-tokens: 8192
          # Near-deterministic: the agent needs a reproducible plan, not a creative one.
          temperature: 0.2

agent:
  jmeter:
    # JMeter's bin directory — the one containing the `jmeter` launcher.
    home-path: ${JMETER_HOME:/path/to/jmeter/bin}
    # Total JMeter runs allowed per request, counting the first: one generation, two repairs.
    max-retries: 3
    # Where generated plans, test data and results are written.
    workspace: ${AGENT_WORKSPACE:workspace}
    # A single JMeter run is killed past this budget so the agent can never hang.
    execution-timeout: 10m
    # Defaults to <home-path>/../lib; set only for non-standard JMeter layouts.
    # lib-path:
    max-har-entries: 150
    max-har-body-characters: 2000
    max-sql-queries: 200
    max-process-output-characters: 8000
    max-recorded-failures: 500

  # What the pipeline is willing to merge. Off by default: adding the agent to a pipeline
  # should never silently start failing builds. See examples/ci/github-actions.yml.
  gate:
    enabled: ${AGENT_GATE_ENABLED:false}
    # Block when a sampler is materially and unusually slower than its own baseline.
    fail-on-regression: true
    # A healed plan may be testing something other than what the change touched. Off by
    # default, because rejecting every healed plan defeats the point of self-healing.
    fail-on-healing: false
    # Absolute p95 ceiling in milliseconds; 0 means no ceiling.
    max-p95-millis: 0
    max-failure-rate-percent: 0
    report-file: ${AGENT_WORKSPACE:workspace}/performance-report.md
    # GitHub Actions sets $GITHUB_STEP_SUMMARY per step; leave unset elsewhere.
    # step-summary-file:

logging:
  level:
    com.ai.jmeter.agent: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{28} - %msg%n"
